# api-relay 对外反代（IPv6 直连版）
#
# 放到 /etc/nginx/conf.d/api-relay.conf
# 模板来源：隔壁 `二转moa模型/templates/nginx-relaygate-v6.conf`（改端口与路径）
# 前提：云控制台/光猫已放行 IPv6 入站 TCP 80、443、8443
#
# 设计要点（都是踩出来的，别删）：
#   · proxy_buffering off —— SSE 必须，否则流式会被 nginx 攒着一起发
#   · 长 read/send timeout —— 长思考模型 + 大上下文（实测 586KB 请求要 20~30s 才出首字节）
#   · 管理面只放内网 —— /admin 与 /admin/api 绝不对外
#   · /healthz 不外露 —— 它会泄漏上游名、熔断状态、计数器
#   · X-Forwarded-For —— 网关开了 trustProxy，审计要留真实客户 IP

# ── 80：ACME 验证 + 跳转 HTTPS ──
server {
    listen [::]:80;
    server_name _;

    # Let's Encrypt 的 http-01 验证需要它可达；证书稳定后可整块删掉
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── 8443 / 443：数据面 ──
server {
    listen [::]:8443 ssl;
    listen [::]:443  ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/api-relay.crt;   # 自签或 LE 路径
    ssl_certificate_key /etc/nginx/ssl/api-relay.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ── 只暴露数据面 ──
    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;          # SSE 必须
        proxy_cache off;
        proxy_read_timeout 300s;      # 大上下文首字节可能 20~30s，长推理更久
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── 管理面：只放内网 ──
    # 注意：/admin 的 HTML 外壳在网关侧本就不要 token（刻意设计），
    # 所以**必须在这里挡住**，否则等于把面板公开了。
    location = /admin          { allow 192.168.0.0/16; allow fd00::/8; deny all; proxy_pass http://127.0.0.1:8787; }
    location /admin/           { allow 192.168.0.0/16; allow fd00::/8; deny all; proxy_pass http://127.0.0.1:8787; }
    location /internal/        { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:8787; }

    # ── 探针不外露 ──
    location = /healthz { return 404; }
    location = /admin/api/overview { return 404; }
}
